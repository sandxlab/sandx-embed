[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sandx-embed"
version = "0.1.0"
description = "Embedding infrastructure — pluggable encoders, ANN indexing, cross-domain similarity"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SandX Lab", email = "research@sandx.io" }]
requires-python = ">=3.10"
keywords = ["embeddings", "approximate-nearest-neighbor", "vector-search", "machine-learning", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "hnswlib>=0.8",
    "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "ruff"]

[project.urls]
Homepage      = "https://sandx.io"
Repository    = "https://github.com/sandxlab/sandx-embed"
"Bug Tracker" = "https://github.com/sandxlab/sandx-embed/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = ["slow: requires network or large model download"]
